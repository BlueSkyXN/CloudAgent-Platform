standard = "2.0"
project = "cloudagent-platform"
space = "BlueSkyXN/cloudagent-platform-hfs-v2-candidate"
sovereignty = "sovereign"
lane = "source"
version_source = "commit"

# Local control-plane credentials; never sent to the Space.
local_only = ["HF_TOKEN", "GH_TOKEN"]

# Key names only. CLOUDAGENT_AUTH_TOKEN is required at runtime.
secrets = ["CLOUDAGENT_AUTH_TOKEN"]
optional_secrets = []
variables = []
